name: flutter_gen_ai_chat_ui
description: "AI chat UI for Flutter. Streaming text, markdown, LaTeX, rich inline widgets, function-calling/agent surface, RTL, theming. ChatGPT/Claude/Gemini ready."
version: 2.17.0
homepage: https://github.com/hooshyar/flutter_gen_ai_chat_ui
repository: https://github.com/hooshyar/flutter_gen_ai_chat_ui
issue_tracker: https://github.com/hooshyar/flutter_gen_ai_chat_ui/issues
documentation: https://github.com/hooshyar/flutter_gen_ai_chat_ui/blob/main/README.md
funding:
  - https://github.com/sponsors/hooshyar
topics: [ai, chat, llm, streaming, markdown]

screenshots:
  - description: "Streaming welcome / empty state."
    path: streaming-welcome.png
  - description: "Streamed answer with a polished code block."
    path: streaming-codeblock.png
  - description: "Example app in dark mode."
    path: screenshots/detailed_dark.png

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  # flutter floor raised from 3.27.0 to 3.35.0 (task-012): the old claim
  # was inaccurate, discovered iteratively via the sdk-matrix CI job's
  # floor leg actually resolving `flutter pub get` at old Flutter versions
  # (CI had always run on `stable`, silently masking this):
  #   - flutter_streaming_text_markdown (any version) depends on
  #     characters >=1.4.0, unavailable until Flutter 3.29.0.
  #   - google_fonts ^8.1.0's own declared floor is sdk ^3.9.0 / flutter
  #     >=3.35.0 — the binding constraint, higher than the above.
  # 3.35.0 (bundling Dart 3.9.0) is the first stable Flutter release
  # where this package's full dependency tree actually resolves,
  # confirmed both analytically (checking every direct + relevant
  # transitive dependency's floor against pub.dev) and by the sdk-matrix
  # job going green against it. A real consumer on Flutter
  # 3.27.x-3.34.x was already unable to `flutter pub get` this package;
  # this only makes the declared floor match that pre-existing reality.
  # `sdk:` is deliberately left at 3.6.0, not bumped to match 3.35.0's
  # bundled 3.9.0 — Dart 3.7 shipped a new default `dart format` style
  # (gated on the package's declared language version), so raising this
  # constraint past that threshold would force-reformat the entire
  # codebase for no functional reason. Every Dart version any Flutter
  # >=3.35.0 actually ships already satisfies >=3.6.0, so the two
  # constraints stay consistent without it.
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.2
  flutter_markdown_plus: ^1.0.3
  google_fonts: ^8.1.0
  flutter_streaming_text_markdown: ^1.9.1
  url_launcher: ^6.3.1
  flutter_math_fork: ^0.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  speech_to_text: ^7.2.0
  network_image_mock: ^2.1.1
  integration_test:
    sdk: flutter
  provider: ^6.1.2

flutter:
  uses-material-design: true
