name: CI

# Lightweight CI gate for the flutter_gen_ai_chat_ui package.
#
# What this catches:
#   - Formatter drift (`dart format --set-exit-if-changed`). The local
#     `flutter analyze` step does NOT catch formatter drift, and pub.dev's
#     `pana` deducts 10 points if any file is unformatted (iter-7 of the
#     internal maintenance log surfaced this as a real recurring risk
#     introduced by dartdoc edits).
#   - Static analyzer warnings (`flutter analyze`).
#   - Unit + widget test regressions (`flutter test`).
#   - Doc/code drift: README.md/AGENTS.md ```dart snippets calling a
#     factory/method that no longer exists on the public API (task-012).
#   - The documented SDK floor (Flutter 3.29.0/Dart 3.7.0) actually
#     resolving and passing tests for a real consumer, alongside latest
#     stable (task-012's `sdk-matrix` job).
#
# Intentionally not in scope here:
#   - `dart pub publish --dry-run` (the user controls releases and
#     gitignored-file state).
#   - `pana` (slow; runs locally as part of the release-prep checklist).
#   - Integration tests under `example/integration_test/` (require a
#     running device/simulator; gated by the package's "do not run app on
#     simulators in CI" policy).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  version-consistency:
    name: Version consistency (pubspec ↔ README)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check README install snippet matches pubspec version
        # Catches the recurring "bumped pubspec but forgot the README install
        # snippet" drift. No Flutter toolchain needed, so this fails fast.
        run: |
          version="$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/version:[[:space:]]*//')"
          echo "pubspec version: $version"
          if ! grep -qF "flutter_gen_ai_chat_ui: ^$version" README.md; then
            echo "::error::README install snippet does not reference ^$version (pubspec version)."
            grep -nE 'flutter_gen_ai_chat_ui:[[:space:]]*\^?[0-9]' README.md || true
            exit 1
          fi
          echo "README install snippet matches."

  analyze-format-test:
    name: Analyze, format, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        # The leading `dart format --set-exit-if-changed` is the iter-8
        # guardrail. If any file is unformatted this step fails the build
        # before analyze/tests run, surfacing the issue immediately.
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Analyze example app
        # The example/ directory has its own pubspec and is outside the
        # package's analyzer scope. Iter-10 surfaced 9 lints there that
        # the main `flutter analyze` step did not catch, so we gate
        # example-app regressions explicitly.
        run: |
          cd example
          flutter pub get
          flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      - name: Check doc/code drift (README.md, AGENTS.md)
        # task-012: catches the ONBOARDING_AUDIT failure mode (a doc
        # snippet calling a factory/method that no longer exists) the way
        # a future accidental rename or removal would trigger it, instead
        # of relying on the next manual audit to notice.
        run: dart run tool/check_doc_drift.dart

  sdk-matrix:
    name: SDK matrix (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "documented floor (Flutter 3.29.0 / Dart 3.7.0)"
            flutter-version: "3.29.0"
          - label: "latest stable"
            channel: stable
    # task-012: verifies the floor this package actually promises
    # CONSUMERS (`environment:` in pubspec.yaml: sdk >=3.7.0, flutter
    # >=3.29.0), plus latest stable, alongside the existing
    # `analyze-format-test` job (which always runs on `stable` and is the
    # primary day-to-day gate).
    #
    # This deliberately drives the floor leg through `example/` rather
    # than `flutter pub get` on the ROOT pubspec: the root package's
    # dev_dependencies (`flutter_lints: ^6.0.0`, which needs Dart ^3.8.0 —
    # see issue #41) are CONTRIBUTOR tooling only. A real consumer never
    # resolves a path/hosted dependency's dev_dependencies (pub ignores
    # them), so trying to `flutter pub get` the root pubspec at the floor
    # would fail for a reason that has nothing to do with the actual
    # consumer-facing floor this job exists to verify. `example/` depends
    # on this package the same way a real consumer would (a normal,
    # non-dev dependency) and pins its own dev_dependencies low enough
    # (`flutter_lints: ^3.0.1`, Dart `^3.0.0`) to resolve cleanly at the
    # floor, making it the right proxy — and as a side benefit this is the
    # first place `example/`'s own test suite runs in CI at all.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (floor)
        if: matrix.flutter-version
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          cache: true

      - name: Set up Flutter (${{ matrix.label }})
        if: matrix.channel
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          cache: true

      - name: Print Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install example dependencies
        run: |
          cd example
          flutter pub get

      - name: Test example app
        run: |
          cd example
          flutter test --reporter expanded

  wasm-build:
    name: Web (wasm) build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Guards task-015 (GOAL item 4, "wasm-ready"): the package compiled and ran
    # cleanly under dart2wasm on the first check (2026-09-03) with zero source
    # changes needed. This job exists so a FUTURE dependency or code change
    # that reintroduces an incompatible API (dart:html/dart:js legacy interop,
    # dart:mirrors, etc.) fails CI immediately instead of being discovered
    # only when a consumer tries `flutter build web --wasm`.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Install example dependencies
        run: |
          cd example
          flutter pub get

      - name: Build example for web with --wasm
        run: |
          cd example
          flutter build web --wasm --release
