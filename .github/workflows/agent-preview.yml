# TEMPORARY - lives only on agent/preview-* branches, never merged.
# Builds the release-candidate example apps for web and publishes them to
# gh-pages under /preview/ (keep_files, so the live demo at the site root is
# untouched). The next normal demo deploy from main replaces the whole branch
# and removes the preview again.
#   streaming: hooshyar/flutter_streaming_text_markdown @ agent/quick-wins-2026-10
#   chat:      this branch, with the streaming package overridden to that same
#              release candidate (the combination users get after both ship).
name: agent-preview

on:
  push:
    branches: ['agent/preview-*']

permissions:
  contents: write

concurrency:
  group: agent-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: hooshyar/flutter_streaming_text_markdown
          ref: agent/quick-wins-2026-10
          path: _stm

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain
        run: echo "::notice title=toolchain::$(flutter --version | head -1) / $(dart --version 2>&1)"

      - name: Build streaming example
        run: |
          set -o pipefail
          run() { "$@" > step.log 2>&1 || { echo "::error title=streaming: $*::$(tail -50 step.log | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }; }
          cd _stm
          run flutter pub get
          run dart run tool/generate_version.dart
          cd example
          run flutter pub get
          run flutter build web --release --base-href /flutter_gen_ai_chat_ui/preview/streaming/
          mkdir -p "$GITHUB_WORKSPACE/_site" && cp -r build/web "$GITHUB_WORKSPACE/_site/streaming"
          echo "::notice title=streaming resolved::$(grep -A6 'gpt_markdown:' pubspec.lock | grep -m1 version | xargs)"

      - name: Build chat example (streaming overridden to the release candidate)
        run: |
          set -o pipefail
          run() { "$@" > step.log 2>&1 || { echo "::error title=chat: $*::$(tail -50 step.log | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }; }
          printf 'dependency_overrides:\n  flutter_streaming_text_markdown:\n    path: ../_stm\n' > example/pubspec_overrides.yaml
          run flutter pub get
          cd example
          run flutter pub get
          run dart run tool/generate_version.dart
          run flutter build web --release --base-href /flutter_gen_ai_chat_ui/preview/chat/
          cp -r build/web "$GITHUB_WORKSPACE/_site/chat"
          echo "::notice title=chat resolved::streaming $(grep -A6 'flutter_streaming_text_markdown:' pubspec.lock | grep -m1 -E 'version|path' | xargs)"

      - name: Publish preview to gh-pages/preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          destination_dir: preview
          keep_files: true
          publish_branch: gh-pages
          commit_message: "preview: release candidates (temporary)"
